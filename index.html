<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirt Rally 2.0 Tracker</title>
  <link rel="stylesheet" href="css/app.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Ropa+Sans:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body id="app">
  <header>
    <!-- Hero -->
    <div class="hero text-center bg-image">
      <div class="mask h-100" style="background-color: rgba(0, 0, 0, 0.6);">
        <div class="d-flex justify-content-center align-items-center h-100">
          <div class="text-white">
            <h1>Dirt Rally 2.0 Tracker</h1>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Results modal uses BaseModal component -->
  <base-modal :show="showResultModal" title="Enter Result" @close="showResultModal = false">
    <result-form id-prefix="modal" :initial-values="resultDefaults" :countries="countries" :stage-data="stageData"
      :car-groups="carGroups" :lock-context="lockResultContext" @save="addResult" @cancel="showResultModal = false">
    </result-form>
  </base-modal>

  <!-- Events Modal uses BaseModal component -->
  <event-form-modal :show="showEventModal" :event="eventBeingEdited" :countries="countries" :stage-data="stageData"
    :car-groups="carGroups" @save="saveEvent" @close="showEventModal = false">
  </event-form-modal>

  <main class="bg-light pb-5">
    <!-- Main container for all page content -->
    <div class="container pb-5">
      <div class="text-center pt-3 mb-3">
        <h2>Events</h2>
      </div>
      <!-- First row: Current events & add event button -->
      <div class="row align-items-center my-3">
        <!-- Current Events table component - Format buttons for adding events to the right on desktop, underneath on mobile -->
        <event-list class="col-lg-8 mb-3" :events="events" @edit="editEvent" @delete="deleteEvent"
          @add-result="prefillResultForEvent">
        </event-list>

        <div class="col-lg-4 align-self-start">
          <button type="button" class="btn btn-custom w-100 py-5 fs-4" @click="startAddEvent">
            Add</button>
        </div>
      </div>
      <!-- Second row: Stages and Statistics -->
      <div class="row pb-4">
        <div class="col-lg-6 mt-4">
          <h2 class="text-center mt-3 mb-2">Stage Times</h2>
          <!-- CountrySelect component -->
          <country-select id="countrySelect" v-model="selectedCountry" :countries="countries" label="Country"
            placeholder="Choose a country to view times" allow-clear class="mb-3">
          </country-select>

          <!-- Stage times table component -->
          <stage-times-table :results="stageResults" :selected-country="selectedCountry" :selected-stage="selectedStage"
            @select-stage="selectedStage = $event" @delete-result="deleteResult">
          </stage-times-table>

          <button type="button" class="btn btn-custom w-100 py-3" @click="toggleInlineForm">
            {{ showInlineForm ? "Close" : "Add" }}
          </button>
          <div v-if="showInlineForm" class="card card-body mt-3">
            <result-form id-prefix="inline" :initial-values="{ country: selectedCountry }" :countries="countries"
              :stage-data="stageData" :car-groups="carGroups" @save="addResult" @cancel="showInlineForm = false">
            </result-form>
          </div>
        </div>
        <div class="col-lg-6 mt-4">
          <h2 class="text-center mt-3 mb-2">Stage Chart</h2>
          <!-- Chart.js component -->
          <stage-chart :results="stageResults" :selected-stage="selectedStage"></stage-chart>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center">
    <p class="p-5 m-0">&copy; Zane Robe - 2026 - Dirt Rally 2.0 Tracker</p>
  </footer>
  <!-- Loads the latest global build of Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Components -->
  <script src="js/components/CountrySelect.js"></script>
  <script src="js/components/StageSelect.js"></script>
  <script src="js/components/CarSelect.js"></script>
  <script src="js/components/BaseModal.js"></script>
  <script src="js/components/EventFormModal.js"></script>
  <script src="js/components/ResultForm.js"></script>
  <script src="js/components/EventItem.js"></script>
  <script src="js/components/EventList.js"></script>
  <script src="js/components/StageTimesTable.js"></script>

  <!-- Chart.js cdn -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/components/StageChart.js"></script>

  <script src="js/app.js"></script>
</body>

</html>
