<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirt Rally 2.0 Tracker</title>
  <link rel="stylesheet" href="css/app.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Ropa+Sans:ital@0;1&display=swap"
    rel="stylesheet">
</head>

<body id="app">
  <header>
    <!-- Hero -->
    <div class="hero text-center bg-image">
      <div class="mask h-100" style="background-color: rgba(0, 0, 0, 0.6);">
        <div class="d-flex justify-content-center align-items-center h-100">
          <div class="text-white">
            <h1>Dirt Rally 2.0 Tracker</h1>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Results modal -->
  <div class="modal" id="resultsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Enter Result</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form action="/">
            <div class="form-floating">
              <select class="form-select form-select-lg mb-3 h-100" id="resultStage"
                aria-label="Large select for stages">
                <option selected disabled>Choose a stage</option>
              </select>
              <label for="resultStage">Stage</label>
            </div>
            <div class="row mb-3">
              <div class="form-floating col-4">
                <input type="number" class="form-control" id="floatingPosition" placeholder="20" min="1">
                <label for="floatingPosition" class="ms-2">Position</label>
              </div>
              <div class="form-floating col-8">
                <input type="date" class="form-control" id="floatingDateInput" placeholder="01/01/2000">
                <label for="floatingDateInput" class="ms-2">Result Date</label>
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <div class="form-floating">
                  <select class="form-select form-select-sm h-100 fs-6 mb-3" id="weatherSelect"
                    aria-label="Small select for weather">
                    <option selected disabled>Choose weather</option>
                    <option value="Clear">Clear/Sunny</option>
                    <option value="Cloudy">Cloudy</option>
                    <option value="Drizzle">Drizzle/Light rain</option>
                    <option value="Heavy">Heavy rain</option>
                    <option value="Night">Night</option>
                  </select>
                  <label for="weatherSelect">Weather</label>
                </div>
              </div>
              <div class="form-floating col-6">
                <input type="text" class="form-control" id="floatingTimeInput" placeholder="3:58.223">
                <label for="floatingTimeInput" class="ms-2">Time (mm:ss.fff)</label>
              </div>
            </div>
            <div class="form-floating mb-3">
              <textarea class="form-control" placeholder="Race notes" id="floatingTextareaNotes"></textarea>
              <label for="floatingTextareaNotes">Notes</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="resultPB">
              <label class="form-check-label" for="resultPB">Personal best</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-custom">Save results</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Events Modal -->
  <div class="modal" id="eventsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Enter Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form action="/">
            <div class="row mb-3">
              <div class="form-floating col-7">
                <input type="date" class="form-control" id="floatingEventDateInput" placeholder="01/01/2000">
                <label for="floatingEventDateInput" class="ms-2">Date started</label>
              </div>
              <div class="col-5">
                <div class="form-floating">
                  <select class="form-select form-select-sm h-100 fs-6" id="rankSelect"
                    aria-label="Small select for rank">
                    <option selected disabled>Choose rank</option>
                    <option value="Time-trials">Time Trials</option>
                    <option value="Clear">Open</option>
                    <option value="Cloudy">Clubman</option>
                    <option value="Drizzle">Semi-Pro</option>
                    <option value="Heavy">Pro</option>
                    <option value="Night">Elite</option>
                  </select>
                  <label for="rankSelect">Rank</label>
                </div>
              </div>
            </div>
            <div class="mb-3 form-floating">
              <select class="form-select form-select-lg h-100 fs-6 mb-3" id="carSelect"
                aria-label="large select for car">
                <option selected disabled>Choose car</option>
                <option value="mini-cooper-s">Mini Cooper S (H1 FWD)</option>
                <option value="peugeot-205-gti">Peugeot 205 GTI (H2 FWD)</option>
                <option value="ford-escort-mk2">Ford Escort Mk II (H2 RWD)</option>
                <option value="lancia-stratos">Lancia Stratos (H3 RWD)</option>
                <option value="audi-quattro-s1-e2">Audi Sport Quattro S1 E2 (Group B 4WD)</option>
                <option value="lancia-delta-s4">Lancia Delta S4 (Group B 4WD)</option>
                <option value="subaru-impreza-1995">Subaru Impreza 1995 (Group A)</option>
                <option value="mitsubishi-lancer-evo6">Mitsubishi Lancer Evolution VI (Group A)</option>
                <option value="ford-fiesta-r5">Ford Fiesta R5 (R5)</option>
                <option value="porsche-911-rgt">Porsche 911 RGT (Rally GT)</option>
              </select>
              <label for="carSelect">Car</label>
            </div>
            <div class="row mb-3">
              <div class="col-8">
                <div class="form-floating">
                  <select class="form-select form-select-lg h-100 fs-6 mb-3" id="eventSelect"
                    aria-label="large select for event type">
                    <option selected disabled>Choose event</option>
                    <option value="career-rally">Career Rally</option>
                    <option value="career-rallycross">Career Rallycross</option>
                    <option value="daily-challenge">Daily Challenge</option>
                    <option value="weekly-challenge">Weekly Challenge</option>
                    <option value="monthly-challenge">Monthly Challenge</option>
                    <option value="daily-ai-challenge">Daily AI Challenge</option>
                    <option value="weekly-ai-challenge">Weekly AI Challenge</option>
                    <option value="monthly-ai-challenge">Monthly AI Challenge</option>
                  </select>
                  <label for="eventSelect">Event type</label>
                </div>
              </div>
              <div class="form-floating col-4">
                <input type="number" class="form-control" id="floatingRaceNumber" placeholder="6" min="1">
                <label for="floatingRaceNumber" class="ms-2"># of stages</label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-custom">Save Event</button>
        </div>
      </div>
    </div>
  </div>

  <main class="bg-light pb-5">
    <!-- Main container for all page content -->
    <div class="container pb-5">
      <div class="text-center pt-3 mb-3">
        <h2>Dashboard</h2>
      </div>
      <!-- First row: Current events & add event button -->
      <div class="row align-items-center my-3">
        <!-- Current Events table - Format buttons for adding events to the right on desktop, underneath on mobile -->
        <div class="accordion col-lg-8 mb-3" id="eventsAccordion">

          <!-- Career Rallycross -->
          <div class="accordion-item" v-for="event in events">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#event-rallycross">
                {{event.name}}
              </button>
            </h2>
            <div class="progress rounded-0">
              <div class="progress-bar" role="progressbar" style="width: 65%;" aria-valuenow="65" aria-valuemin="0"
                aria-valuemax="100"></div>
            </div>
            <div id="event-rallycross" class="accordion-collapse collapse" data-bs-parent="#eventsAccordion">
              <div class="accordion-body">
                <div class="row align-items-center">
                  <div class="col-11">
                    <p class="mb-1"><strong>12th Place</strong> — Ford Fiesta OMSE Supercar Lites</p>
                    <p class="mb-1">Rank: Clubman</p>
                    <p class="mb-3">Next Stage: Mettet, Belgium — Qualifier</p>
                  </div>
                  <div class="col-1">
                    <i class="bi bi-trash fs-3"></i>
                  </div>
                </div>
                <button type="button" class="btn btn-custom w-100" data-bs-toggle="modal" data-bs-target="#resultsModal"
                  data-stage="Mettet Circuit">
                  + Add Result
                </button>
              </div>
            </div>
          </div>

        <div class="col-lg-4 align-self-start">
          <button type="button" class="btn btn-custom w-100 py-5" data-bs-toggle="modal"
            data-bs-target="#eventsModal">Add Event</button>
        </div>
      </div> 
          <!-- Second row: Stages and Statistics -->
          <div class="row pb-4">
            <div class="col-lg-6 mt-4">
              <h2 class="text-center mt-3 mb-2">Stage Times</h2>
              <div class="form-floating">
                <select id="countrySelect" class="form-select form-select-lg mb-3 h-100"
                  aria-label="Large select for countries">
                  <option selected>Choose a country to view times</option>
                  <option value="Argentina">Argentina</option>
                  <option value="Australia">Australia</option>
                  <option value="Belgium">Belgium</option>
                  <option value="Canada">Canada</option>
                  <option value="France">France</option>
                  <option value="New Zealand">New Zealand</option>
                  <option value="Norway">Norway</option>
                  <option value="Poland">Poland</option>
                  <option value="Portugal">Portugal</option>
                  <option value="SpainR">Spain (Rally)</option>
                  <option value="SpainRX">Spain (Rallycross)</option>
                  <option value="Sweden">Sweden</option>
                  <option value="United Kingdom">United Kingdom</option>
                  <option value="United States">United States</option>
                </select>
                <label for="countrySelect">Country</label>
              </div>
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col">Stage</th>
                    <th scope="col">Time</th>
                    <th scope="col">Conditions</th>
                    <th scope="col">PB</th>
                  </tr>
                </thead>
                <tbody id="stageTableBody">
                  <!-- JS fills this in -->
                </tbody>
              </table>
              <button type="button" class="btn btn-custom w-100 py-3" data-bs-toggle="modal"
                data-bs-target="#resultsModal">Add
                Result</button>
            </div>
            <div class="col-lg-6 mt-4">
              <h2 class="text-center mt-3 mb-2">Stage Chart</h2>
              <div class="form-floating">
                <select class="form-select form-select-lg mb-3 h-100" id="stageSelect"
                  aria-label="Large select for stages" disabled>
                  <option selected disabled>Choose a stage</option>
                </select>
                <label for="stageSelect">Stage</label>
              </div>
              <img src="src/chart-placeholder.svg" alt="Placeholder for chart of race times">
            </div>
          </div>
        </div>
  </main>

  <script src="js/app.js"></script>
