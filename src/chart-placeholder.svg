<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fillGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9534f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d9534f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="400" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
    Las Juntas — Time Trend
  </text>
  <text x="30" y="58" font-family="Arial, sans-serif" font-size="12" fill="#9a9a9a">
    Chart placeholder — live data coming in a future build
  </text>

  <!-- Chart area border -->
  <rect x="60" y="80" width="600" height="260" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Horizontal gridlines -->
  <line x1="60" y1="145" x2="660" y2="145" stroke="#2e2e2e" stroke-width="1"/>
  <line x1="60" y1="210" x2="660" y2="210" stroke="#2e2e2e" stroke-width="1"/>
  <line x1="60" y1="275" x2="660" y2="275" stroke="#2e2e2e" stroke-width="1"/>

  <!-- Y-axis labels (time, lower = faster) -->
  <text x="50" y="88" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="end">3:20</text>
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="end">3:15</text>
  <text x="50" y="215" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="end">3:10</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="end">3:05</text>
  <text x="50" y="345" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="end">3:00</text>

  <!-- X-axis labels (dates) -->
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">6/1</text>
  <text x="220" y="365" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">6/15</text>
  <text x="340" y="365" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">7/1</text>
  <text x="460" y="365" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">7/14</text>
  <text x="580" y="365" font-family="Arial, sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle">8/22</text>

  <!-- Filled area under line -->
  <path d="M100,120 L220,160 L340,145 L460,235 L580,300 L580,340 L100,340 Z" fill="url(#fillGradient)"/>

  <!-- Line -->
  <polyline points="100,120 220,160 340,145 460,235 580,300"
    fill="none" stroke="#d9534f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="100" cy="120" r="5" fill="#d9534f" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="220" cy="160" r="5" fill="#d9534f" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="340" cy="145" r="5" fill="#d9534f" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="460" cy="235" r="5" fill="#d9534f" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="300" r="6.5" fill="#ffffff" stroke="#d9534f" stroke-width="2.5"/>

  <!-- PB badge on last point -->
  <text x="580" y="290" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">⭐</text>
</svg>
